name: Build Mercedes Doctor AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir source
          unzip -o MercedesDoctorAI_cloudbuild_v0.1.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p source --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MercedesDoctorAI-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
