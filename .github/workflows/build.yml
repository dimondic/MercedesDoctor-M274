name: Build Mercedes Doctor AI

on:
  workflow_dispatch:
  push:
    branches: [main, codex/m274-v0.3-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project
        run: python3 tools/prepare_project.py source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: OBD protocol regression checks
        run: |
          mkdir -p /tmp/obd-tests
          javac -d /tmp/obd-tests app/src/main/java/ru/mercedesdoctorai/ObdProtocol.java app/src/test/java/ru/mercedesdoctorai/ObdProtocolCheck.java
          java -cp /tmp/obd-tests ru.mercedesdoctorai.ObdProtocolCheck

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Test, build and lint APK
        run: gradle -p source --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:lintDebug :app:lintRelease

      - name: Verify published release APK
        working-directory: downloads
        run: |
          sha256sum -c MercedesDoctor-M274-v0.4-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose MercedesDoctor-M274-v0.4-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MercedesDoctor-M274-v0.4-DEBUG
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: MercedesDoctor-M274-v0.4-RELEASE
          path: downloads/MercedesDoctor-M274-v0.4-release.apk
          if-no-files-found: error
