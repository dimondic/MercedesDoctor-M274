name: Build Mercedes Doctor AI

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir source
          unzip -o MercedesDoctorAI_cloudbuild_v0.1-1.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p source --no-daemon -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MercedesDoctorAI-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
